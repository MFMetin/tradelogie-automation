name: visual

# Visual regression, and the only thing that writes the committed baselines.
#
# Font rasterisation differs per platform, so a baseline taken on a developer's
# Windows machine fails on this runner on every pixel of every glyph. The suite
# stores screenshots under `{platform}` and .gitignore excludes darwin and
# win32, which leaves exactly one source of truth for the Linux set: this job.
on:
  workflow_dispatch:
    inputs:
      update:
        description: 'Regenerate the baselines and push them to a branch'
        type: boolean
        default: false
  pull_request:
    # Only when the suite itself changes. The app lives elsewhere, so a visual
    # diff on an unrelated PR here would be noise.
    paths:
      - 'tests/visual/**'
      - 'src/utils/visual.ts'
      - 'playwright.config.ts'

# Only what pushing a branch needs. The pull request is left to a person
# clicking the link this job prints, which also avoids depending on the
# repository setting that governs whether Actions may open PRs at all — a
# setting that is easy to forget and invisible when it is missing.
permissions:
  contents: write

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trading_journal_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trading_journal_e2e
      WEB_REPO: ./app-web
      API_REPO: ./app-api
      E2E_LANG: en
      APP_MODE: build

    steps:
      - uses: actions/checkout@v4

      - name: Check out the web client
        uses: actions/checkout@v4
        with:
          repository: MFMetin/trading_journal_web
          path: app-web
          ssh-key: ${{ secrets.WEB_REPO_DEPLOY_KEY }}

      - name: Check out the API
        uses: actions/checkout@v4
        with:
          repository: MFMetin/trading_journal_backend
          path: app-api
          ssh-key: ${{ secrets.API_REPO_DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: |
          npm ci
          npm ci --prefix app-web
          npm ci --prefix app-api

      # The suite refuses to start against an API whose limiters are on, so a
      # revision without the flag fails here rather than as a wall of timeouts.
      - name: Check the API supports DISABLE_RATE_LIMIT
        working-directory: app-api
        run: |
          if ! grep -q 'disableRateLimit' src/config/env.ts; then
            echo "::error::This revision of the API has no DISABLE_RATE_LIMIT support."
            exit 1
          fi

      - name: Prepare the database
        working-directory: app-api
        run: |
          npx prisma generate
          npx prisma db push
          npm run db:seed

      - run: npx playwright install --with-deps chromium

      - name: Compare against the baselines
        if: ${{ !inputs.update }}
        run: npx playwright test --project=visual

      - name: Regenerate the baselines
        if: ${{ inputs.update }}
        run: npx playwright test --project=visual --update-snapshots

      # Pushed to a branch, never to main. A changed baseline is a change to
      # what the app is supposed to look like, so somebody should see the diff.
      - name: Push the new baselines to a branch
        if: ${{ inputs.update }}
        env:
          BRANCH: visual/update-baselines
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # The directory, not a `**` glob. Git pathspecs and shell globs differ
          # enough that the glob matched nothing, the commit came out empty, and
          # the step reported that as a push failure.
          git add --force tests/visual/__screenshots__/linux

          if git diff --cached --quiet; then
            {
              echo '### Visual baselines unchanged'
              echo
              echo 'Nothing to push: the generated images match what is committed.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          COUNT="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          git commit -m 'Update the visual baselines (generated on Linux in CI)'
          git push --force origin "HEAD:refs/heads/$BRANCH"

          {
            echo "### $COUNT visual baseline(s) pushed to \`$BRANCH\`"
            echo
            echo "[Open a pull request]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$BRANCH?expand=1)"
            echo
            echo 'Every changed image is a change to what the app is supposed to'
            echo 'look like. Review the diffs before merging — an unintentional'
            echo 'one is the regression this suite exists to catch.'
          } >> "$GITHUB_STEP_SUMMARY"

      # The diff images are the whole point of a failure here.
      - name: Upload the diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            test-results/
            playwright-report/
          retention-days: 14
