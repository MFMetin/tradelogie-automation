name: visual

# Visual regression, and the only thing that writes the committed baselines.
#
# Font rasterisation differs per platform, so a baseline taken on a developer's
# Windows machine fails on this runner on every pixel of every glyph. The suite
# stores screenshots under `{platform}` and .gitignore excludes darwin and
# win32, which leaves exactly one source of truth for the Linux set: this job.
#
# `update` mode opens a pull request with the new images rather than committing
# to main — a changed baseline is a change to what the app is supposed to look
# like, and that deserves a human looking at the diff.
on:
  workflow_dispatch:
    inputs:
      update:
        description: 'Regenerate the baselines and open a PR'
        type: boolean
        default: false
  pull_request:
    # Only when the suite itself changes. The app lives elsewhere, so a visual
    # diff on an unrelated PR here would be noise.
    paths:
      - 'tests/visual/**'
      - 'src/utils/visual.ts'
      - 'playwright.config.ts'

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trading_journal_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trading_journal_e2e
      WEB_REPO: ./app-web
      API_REPO: ./app-api
      E2E_LANG: en
      APP_MODE: build

    steps:
      - uses: actions/checkout@v4

      - name: Check out the web client
        uses: actions/checkout@v4
        with:
          repository: MFMetin/trading_journal_web
          path: app-web
          ssh-key: ${{ secrets.WEB_REPO_DEPLOY_KEY }}

      - name: Check out the API
        uses: actions/checkout@v4
        with:
          repository: MFMetin/trading_journal_backend
          path: app-api
          ssh-key: ${{ secrets.API_REPO_DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: |
          npm ci
          npm ci --prefix app-web
          npm ci --prefix app-api

      - name: Prepare the database
        working-directory: app-api
        run: |
          npx prisma generate
          npx prisma db push
          npm run db:seed

      - run: npx playwright install --with-deps chromium

      - name: Compare against the baselines
        if: ${{ !inputs.update }}
        run: npx playwright test --project=visual

      - name: Regenerate the baselines
        if: ${{ inputs.update }}
        run: npx playwright test --project=visual --update-snapshots

      - name: Open a pull request with the new baselines
        if: ${{ inputs.update }}
        uses: peter-evans/create-pull-request@v6
        with:
          branch: visual/update-baselines
          title: 'Update the visual baselines'
          commit-message: 'Update the visual baselines (generated on Linux in CI)'
          body: |
            Regenerated by the `visual` workflow.

            Every changed image is a change to what the app is supposed to look
            like — review the diffs before merging. If one of them is not
            intentional, that is the regression this suite exists to catch.
          add-paths: |
            tests/visual/__screenshots__/linux/**

      # The diff images are the whole point of a failure here.
      - name: Upload the diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            test-results/
            playwright-report/
          retention-days: 14
